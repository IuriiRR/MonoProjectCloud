services:

  firestore:
    build:
      context: .
      dockerfile: Dockerfile.firestore
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "8080:8080"
      - "9099:9099"
      - "4000:4000"
      - "4500:4500"
    command: >
      sh -c "firebase emulators:start --only firestore,auth --project demo-monobank --import=./.emulator-data --export-on-exit"

  users_api:
    build:
      context: .
      dockerfile: Dockerfile.users_api
    environment:
      - FIRESTORE_EMULATOR_HOST=firestore:8080
      - FIRESTORE_PROJECT_ID=demo-monobank
      - FIREBASE_AUTH_EMULATOR_HOST=firestore:9099
      - INTERNAL_API_KEY=dev-internal-key
      # Telegram reports integration
      - REPORT_API_URL=http://report_api:8086
    env_file:
      - .env
    depends_on:
      - firestore
    ports:
      - "8081:8081"

  accounts_api:
    build:
      context: .
      dockerfile: Dockerfile.accounts_api
    environment:
      - FIRESTORE_EMULATOR_HOST=firestore:8080
      - FIRESTORE_PROJECT_ID=demo-monobank
      - FIREBASE_AUTH_EMULATOR_HOST=firestore:9099
      - INTERNAL_API_KEY=dev-internal-key
    env_file:
      - .env
    depends_on:
      - firestore
    ports:
      - "8082:8082"

  transactions_api:
    build:
      context: .
      dockerfile: Dockerfile.transactions_api
    environment:
      - FIRESTORE_EMULATOR_HOST=firestore:8080
      - FIRESTORE_PROJECT_ID=demo-monobank
      - FIREBASE_AUTH_EMULATOR_HOST=firestore:9099
      - INTERNAL_API_KEY=dev-internal-key
    env_file:
      - .env
    depends_on:
      - firestore
    ports:
      - "8083:8083"

  report_api:
    build:
      context: .
      dockerfile: Dockerfile.report_api
    environment:
      - FIRESTORE_EMULATOR_HOST=firestore:8080
      - FIRESTORE_PROJECT_ID=demo-monobank
      - FIREBASE_AUTH_EMULATOR_HOST=firestore:9099
      - INTERNAL_API_KEY=dev-internal-key
      - REPORT_TIMEZONE=Europe/Kyiv
      # Optional: enable Gemini agent loop locally
      # - GEMINI_API_KEY=your_key_here
    env_file:
      - .env
    depends_on:
      - firestore
    ports:
      - "8086:8086"

  telegram_bot:
    build:
      context: .
      dockerfile: Dockerfile.telegram_bot
    # Local dev: Telegram can't reach localhost webhooks, so run polling by default.
    command: [ "python", "polling.py" ]
    environment:
      - USERS_API_URL=http://users_api:8081
      # Ensures polling works even if this bot previously had a webhook configured.
      - TELEGRAM_POLLING_DELETE_WEBHOOK=1
    env_file:
      - .env
    depends_on:
      - users_api
    ports:
      - "8087:8087"

  sync_worker:
    build:
      context: .
      dockerfile: Dockerfile.sync_worker
    environment:
      - FIRESTORE_EMULATOR_HOST=firestore:8080
      - FIRESTORE_PROJECT_ID=demo-monobank
      - USERS_API_URL=http://users_api:8081
      - ACCOUNTS_API_URL=http://accounts_api:8082
      - SYNC_TRANSACTIONS_URL=http://sync_transactions:8085
      - INTERNAL_API_KEY=dev-internal-key
    env_file:
      - .env
    depends_on:
      - firestore
      - users_api
      - accounts_api
      - sync_transactions
    ports:
      - "8084:8084"

  sync_transactions:
    build:
      context: .
      dockerfile: Dockerfile.sync_transactions
    environment:
      - FIRESTORE_EMULATOR_HOST=firestore:8080
      - FIRESTORE_PROJECT_ID=demo-monobank
      - ACCOUNTS_API_URL=http://accounts_api:8082
      - TRANSACTIONS_API_URL=http://transactions_api:8083
      - INTERNAL_API_KEY=dev-internal-key
    env_file:
      - .env
    depends_on:
      - firestore
      - accounts_api
      - transactions_api
    ports:
      - "8085:8085"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      - VITE_USERS_API_URL=http://localhost:8081
      - VITE_ACCOUNTS_API_URL=http://localhost:8082
      - VITE_TRANSACTIONS_API_URL=http://localhost:8083
      - VITE_REPORT_API_URL=http://localhost:8086
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - users_api
      - accounts_api
      - transactions_api
      - report_api
      - telegram_bot
      - firestore

  accounts_api_cloud:
    build:
      context: .
      dockerfile: Dockerfile.accounts_api
    environment:
      - GOOGLE_CLOUD_PROJECT=cloud-monohelper
      - PORT=8092
    env_file:
      - .env
    volumes:
      - ./local_server/secrets:/etc/cloudapi:ro
    ports:
      - "8092:8092"
    command: ["functions-framework", "--target", "accounts_api", "--source", "main.py", "--port", "8092", "--debug"]

  transactions_api_cloud:
    build:
      context: .
      dockerfile: Dockerfile.transactions_api
    environment:
      - GOOGLE_CLOUD_PROJECT=cloud-monohelper
      - PORT=8093
    env_file:
      - .env
    volumes:
      - ./local_server/secrets:/etc/cloudapi:ro
    ports:
      - "8093:8093"
    command: ["functions-framework", "--target", "transactions_api", "--source", "main.py", "--port", "8093", "--debug"]

  sync_transactions_cloud:
    build:
      context: .
      dockerfile: Dockerfile.sync_transactions
    environment:
      - GOOGLE_CLOUD_PROJECT=cloud-monohelper
      - ACCOUNTS_API_URL=http://accounts_api_cloud:8092
      - TRANSACTIONS_API_URL=http://transactions_api_cloud:8093
      - INTERNAL_API_KEY=dev-internal-key
      - PORT=8095
    env_file:
      - .env
    volumes:
      - ./local_server/secrets:/etc/cloudapi:ro
    ports:
      - "8095:8095"
    command: ["functions-framework", "--target", "sync_transactions", "--source", "main.py", "--port", "8095", "--debug"]
    depends_on:
      - accounts_api_cloud
      - transactions_api_cloud

  sync_worker_cloud:
    build:
      context: .
      dockerfile: Dockerfile.sync_worker
    environment:
      - GOOGLE_CLOUD_PROJECT=cloud-monohelper
      - USERS_API_URL=http://users_api:8081
      - ACCOUNTS_API_URL=http://accounts_api_cloud:8092
      - SYNC_TRANSACTIONS_URL=http://sync_transactions_cloud:8095
      - INTERNAL_API_KEY=dev-internal-key
      - PORT=8094
    env_file:
      - .env
    volumes:
      - ./local_server/secrets:/etc/cloudapi:ro
    ports:
      - "8094:8094"
    command: ["functions-framework", "--target", "sync_worker", "--source", "main.py", "--port", "8094", "--debug"]
    depends_on:
      - users_api
      - accounts_api_cloud
      - sync_transactions_cloud
