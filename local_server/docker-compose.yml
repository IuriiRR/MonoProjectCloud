x-service-base: &service_base
  build:
    context: ..
    dockerfile: local_server/Dockerfile.services
  env_file:
    - .env
  volumes:
    - ../functions:/workspace/functions:ro
    - ./src:/workspace/local_server/src:ro
    - ./secrets:/etc/cloudapi:ro
  restart: unless-stopped

services:

  fastapi_app:
    <<: *service_base
    profiles: [local]
    ports:
      - "127.0.0.1:8000:8000"
    command:
      [
        "uvicorn",
        "local_server.main:app",
        "--host", "0.0.0.0",
        "--port", "8000",
        "--reload"
      ]

  scheduler:
    profiles: [local]
    build:
      context: ..
      dockerfile: local_server/Dockerfile.scheduler
    env_file:
      - .env
    volumes:
      - ../functions:/workspace/functions:ro
      - ./src:/workspace/local_server/src:ro
      - ./tests:/workspace/local_server/tests:ro
      - ./secrets:/etc/cloudapi:ro
    ports:
      - "127.0.0.1:9090:9090"
    command: ["python", "-m", "local_server.scheduler"]
    depends_on:
      - fastapi_app

  telegram_polling:
    profiles: [local]
    build:
      context: ..
      dockerfile: local_server/Dockerfile.telegram
    env_file:
      - .env
    volumes:
      - ../functions:/workspace/functions:ro
      - ./secrets:/etc/cloudapi:ro
    command: ["python", "/workspace/functions/telegram_bot/polling.py"]
    depends_on:
      - fastapi_app
