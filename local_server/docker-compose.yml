x-service-base: &service_base
  build:
    context: ..
    dockerfile: local_server/Dockerfile.services
  env_file:
    - .env
  volumes:
    - ../functions:/workspace/functions:ro
    - ./src:/workspace/local_server/src:ro
    - ./secrets:/etc/cloudapi:ro
  restart: unless-stopped

services:

  fastapi_app:
    <<: *service_base
    profiles: [local]
    ports:
      - "127.0.0.1:8088:8088"
    command:
      [
        "uvicorn",
        "local_server.main:app",
        "--host", "0.0.0.0",
        "--port", "8088",
        "--reload"
      ]

  # scheduler service removed — scheduling and control loop now run inside fastapi_app lifespan

  telegram_polling:
    profiles: [local]
    build:
      context: ..
      dockerfile: local_server/Dockerfile.telegram
    env_file:
      - .env
    volumes:
      - ../functions:/workspace/functions:ro
      - ./secrets:/etc/cloudapi:ro
    command: ["python", "/workspace/functions/telegram_bot/polling.py"]
    depends_on:
      - fastapi_app
