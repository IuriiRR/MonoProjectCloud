[project]
name = "cloudapi-local-server"
version = "0.1.0"
description = "Raspberry Pi local scheduler and failover controller for CloudApi"
requires-python = ">=3.11"
dependencies = [
  "APScheduler==3.10.4",
  "Flask==3.0.3",
  "google-cloud-scheduler==2.16.1",
  "pydantic==2.9.2",
  "python-dotenv==1.0.1",
  "requests==2.31.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.2",
]

[tool.pytest.ini_options]
pythonpath = [
  "src",
  "..",
]
