[project]
name = "cloudapi-local-server"
version = "0.1.0"
description = "Raspberry Pi local scheduler and failover controller for CloudApi"
requires-python = ">=3.11"
dependencies = [
  "APScheduler==3.10.4",
  "Flask==3.0.3",
  "fastapi>=0.111.0",
  "firebase-admin==6.5.0",
  "functions-framework==3.8.3",
  "google-cloud-firestore==2.16.1",
  "google-cloud-scheduler==2.16.1",
  "google-genai==0.8.0",
  "loguru==0.7.2",
  "pydantic==2.9.2",
  "python-dotenv==1.0.1",
  "requests==2.31.0",
  "sentry-sdk==2.44.0",
  "sqladmin>=0.17.0",
  "sqlmodel>=0.0.18",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.2",
  "httpx>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "src",
  "..",
]
